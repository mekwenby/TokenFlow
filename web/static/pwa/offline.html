<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>TokenFlow - Offline</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; margin: 0; background: #101820; color: #f8fafc; }
    main { width: min(440px, calc(100% - 40px)); text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { margin: 20px 0 8px; font-size: 24px; letter-spacing: 0; }
    p { margin: 0 0 24px; color: #cbd5e1; line-height: 1.6; }
    a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; border-radius: 7px; background: #22c55e; color: #101820; padding: 0 18px; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/admin/static/tokenflow-logo.svg" alt="">
    <h1>TokenFlow is offline</h1>
    <p>Reconnect to continue chatting.<br>当前处于离线状态，恢复网络后即可继续。</p>
    <a href="/account/chat">Try again</a>
  </main>
</body>
</html>
